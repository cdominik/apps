<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commute App</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .bar-container { display: flex; align-items: flex-end; height: 75px; gap: 4px; margin-top: 18px; }
  .bar { background-color: #3b82f6; width: 100%; border-radius: 2px 2px 0 0; transition: height 0.3s; position: relative; }
  .bar-label { font-size: 0.75rem; text-align: center; color: #6b7280; overflow: hidden; margin-top: 2px;}
  .bar-value { font-size: 0.75rem; text-align: center; position: absolute; top: -18px; left: 0; right: 0; color: #1d4ed8; font-weight: bold; }
</style>
</head>
<body class="bg-gray-100 text-gray-800 p-2 font-sans h-screen flex flex-col">

<div class="max-w-4xl mx-auto bg-white shadow-md rounded p-3 w-full">
  
  <div class="mb-3 flex flex-wrap gap-2 items-center">
    <button onclick="setLocation('Voorschoten', true)" id="btn-voorschoten" class="px-3 py-1.5 rounded bg-blue-600 text-white text-sm shadow transition">Voorschoten</button>
    <button onclick="setLocation('AMS', true)" id="btn-ams" class="px-3 py-1.5 rounded bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm shadow transition">AMS</button>
    <button onclick="autoLocate(true)" class="px-3 py-1.5 rounded bg-gray-800 hover:bg-gray-900 text-white text-sm shadow transition flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      Auto
    </button>
    
    <span id="location-status" class="text-sm text-green-600 font-medium ml-auto"></span>
    
    <button onclick="updateApp()" class="w-8 h-8 rounded bg-indigo-600 hover:bg-indigo-700 text-white shadow transition flex items-center justify-center ml-auto md:ml-0 active:scale-95">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="bg-white p-2 rounded border shadow-sm">
      <h2 class="text-base font-bold border-b pb-1 mb-1" id="rain-title">Rain (2h)</h2>
      <div class="bar-container" id="rain-bars"></div>
      <div class="flex mt-1 gap-1" id="rain-labels"></div>
      <div id="rain-error" class="text-sm text-red-500 mt-1"></div>
    </div>

    <div class="bg-white p-2 rounded border shadow-sm">
      <h2 class="text-base font-bold border-b pb-1 mb-2">Trains (2h)</h2>
      <div id="train-content" class="space-y-2">
        <div class="text-sm text-gray-500 italic">Enter NS API key below and Load.</div>
      </div>
    </div>
  </div>

  <div class="mt-3 flex flex-row gap-2 items-center bg-gray-50 p-2 rounded border">
    <div class="flex-1 min-w-0">
      <input type="text" id="ns-api-key" placeholder="NS API Key" class="w-full border p-1.5 text-sm rounded focus:outline-none focus:border-blue-500" />
    </div>
    <button onclick="updateApp()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 text-sm rounded shadow transition whitespace-nowrap flex-shrink-0 active:scale-95">Load</button>
  </div>

</div>

<script>
const coords = {
  Voorschoten: { lat: 52.1258, lon: 4.4447 },
  AMS: { lat: 52.3702, lon: 4.8952 }
};

const trainRoutes = {
  Voorschoten: [
    { from: 'vst', to: 'dvd', label: 'Vst → Dvd', fromName: 'Voorschoten', toName: 'Duivendrecht' },
    { from: 'vst', to: 'asa', label: 'Vst → Sci Park', fromName: 'Voorschoten', toName: 'Amsterdam Science Park' }
  ],
  AMS: [
    { from: 'asa', to: 'vst', label: 'Sci Park → Vst', fromName: 'Amsterdam Science Park', toName: 'Voorschoten' },
    { from: 'dvd', to: 'vst', label: 'Dvd → Vst', fromName: 'Duivendrecht', toName: 'Voorschoten' }
  ]
};

let currentLoc = 'Voorschoten';
let geoWatchId = null;

const savedKey = localStorage.getItem('nsApiKey');
if (savedKey) {
  document.getElementById('ns-api-key').value = savedKey;
}

function setLocation(loc, userAction = false) {
  const previousLoc = currentLoc;
  currentLoc = loc;
  
  if (userAction) {
    localStorage.setItem('locationPref', loc);
    document.getElementById('location-status').innerText = ''; 
    
    if (geoWatchId) {
      navigator.geolocation.clearWatch(geoWatchId);
      geoWatchId = null;
    }
  }

  document.getElementById('btn-voorschoten').className = loc === 'Voorschoten' 
    ? 'px-3 py-1.5 rounded bg-blue-600 text-white text-sm shadow transition' 
    : 'px-3 py-1.5 rounded bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm shadow transition';
  document.getElementById('btn-ams').className = loc === 'AMS' 
    ? 'px-3 py-1.5 rounded bg-blue-600 text-white text-sm shadow transition' 
    : 'px-3 py-1.5 rounded bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm shadow transition';
  
  document.getElementById('rain-title').innerText = `Rain: ${loc}`;
  
  if (previousLoc !== loc || userAction) {
    updateApp();
  }
}

function autoLocate(userAction = false) {
  if (userAction) {
    localStorage.setItem('locationPref', 'auto');
  }
  
  document.getElementById('location-status').innerText = 'Detecting...';
  
  if (navigator.geolocation) {
    if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
    
    geoWatchId = navigator.geolocation.watchPosition(pos => {
      const { latitude, longitude } = pos.coords;
      const distV = Math.hypot(latitude - coords.Voorschoten.lat, longitude - coords.Voorschoten.lon);
      const distA = Math.hypot(latitude - coords.AMS.lat, longitude - coords.AMS.lon);
      
      const detected = distA < distV ? 'AMS' : 'Voorschoten';
      document.getElementById('location-status').innerText = `${detected} (Live)`;
      
      if (currentLoc !== detected || document.getElementById('rain-bars').innerHTML === '') {
        setLocation(detected, false); 
      }
    }, err => {
      document.getElementById('location-status').innerText = 'Denied';
      setLocation('Voorschoten', false); 
    });
  } else {
    document.getElementById('location-status').innerText = 'No GPS';
    setLocation('Voorschoten', false);
  }
}

async function updateApp() {
  fetchRain();
  fetchTrains();
}

async function fetchRain() {
  const c = coords[currentLoc];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&minutely_15=precipitation&timeformat=unixtime&timezone=auto&forecast_days=1`;
  
  try {
    document.getElementById('rain-error').innerText = '';
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    
    const now = Math.floor(Date.now() / 1000);
    const times = data.minutely_15.time;
    const precip = data.minutely_15.precipitation;
    
    let startIdx = times.findIndex(t => t >= now - 900);
    if (startIdx === -1) startIdx = 0;
    
    const sliceTimes = times.slice(startIdx, startIdx + 8);
    const slicePrecip = precip.slice(startIdx, startIdx + 8);
    
    renderRain(sliceTimes, slicePrecip);
  } catch (e) {
    document.getElementById('rain-error').innerText = 'Failed to load rain';
  }
}

function renderRain(times, precip) {
  const bars = document.getElementById('rain-bars');
  const labels = document.getElementById('rain-labels');
  bars.innerHTML = '';
  labels.innerHTML = '';
  
  const maxPrecip = Math.max(0.5, ...precip); 
  
  for(let i=0; i < precip.length; i++) {
    const val = precip[i];
    const timeLabel = new Date(times[i] * 1000).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    const heightPct = (val / maxPrecip) * 100;
    
    const col = document.createElement('div');
    col.className = 'flex-1 flex flex-col justify-end relative group';
    
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = val === 0 ? '2px' : `${heightPct}%`;
    bar.style.backgroundColor = val === 0 ? '#e5e7eb' : '#3b82f6';
    
    if(val > 0) {
      const vText = document.createElement('div');
      vText.className = 'bar-value';
      vText.innerText = val.toFixed(1);
      col.appendChild(vText);
    }
    
    const label = document.createElement('div');
    label.className = 'bar-label flex-1';
    label.innerText = timeLabel;
    
    col.appendChild(bar);
    bars.appendChild(col);
    labels.appendChild(label);
  }
}

async function fetchTrains() {
  const apiKey = document.getElementById('ns-api-key').value.trim();
  const container = document.getElementById('train-content');
  
  if (!apiKey) {
    container.innerHTML = '<div class="text-red-500 text-sm">Need API key</div>';
    return;
  }

  localStorage.setItem('nsApiKey', apiKey);
  container.innerHTML = '<div class="text-sm text-gray-500">Fetching...</div>';
  
  const routes = trainRoutes[currentLoc];
  let html = '';

  for (const route of routes) {
    const nowIsoSafe = new Date().toISOString().split('.')[0] + 'Z';
    const baseUrl = `https://gateway.apiportal.ns.nl/reisinformatie-api/api/v3/trips?fromStation=${route.from}&toStation=${route.to}&nextAdvises=6&subscription-key=${apiKey}&dateTime=${nowIsoSafe}`;
    const url = `https://corsproxy.io/?${encodeURIComponent(baseUrl)}&cb=${Date.now()}`;
    
    const nsAppUrl = `https://www.ns.nl/reisplanner/#/?vertrek=${encodeURIComponent(route.fromName)}&vertrektype=treinstation&aankomst=${encodeURIComponent(route.toName)}&aankomsttype=treinstation`;
    
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      
      const data = await res.json();
      
      if (data.statusCode && data.statusCode !== 200) {
          throw new Error(data.message || `API Error ${data.statusCode}`);
      }

      const validTrips = data.trips || [];

      // Increased padding (px-3 py-2) to expand touch target size and styled as a distinct button
      html += `<div class="mb-2">
        <a href="${nsAppUrl}" target="_blank" rel="noopener noreferrer" class="flex justify-between items-center font-bold text-gray-800 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 px-3 py-2 rounded text-sm mb-1 shadow-sm transition block">
          <span>${route.label}</span>
          <span class="text-xs text-blue-600 font-bold flex items-center gap-1 bg-white px-2 py-0.5 rounded shadow-sm">
            NS App
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          </span>
        </a>`;
      
      if (validTrips.length === 0) {
        html += `<div class="text-sm text-gray-500 px-1.5">No trips found</div>`;
      } else {
        html += `<ul class="space-y-0 px-1">`;
        validTrips.forEach(t => {
          const dep = new Date(t.legs[0].origin.plannedDateTime).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          const arr = new Date(t.legs[t.legs.length - 1].destination.plannedDateTime).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          
          let rawStatus = t.status;
          if (rawStatus === 'ALTERNATIVE_TRANSPORT') rawStatus = 'ALT';
          const status = t.status !== 'NORMAL' ? `<span class="text-red-500 font-bold ml-1 text-xs uppercase">${rawStatus}</span>` : '';
          
          const transfers = t.transfers || 0;
          
          html += `<li class="flex justify-between items-center text-sm border-b border-gray-100 py-1">
            <span><strong>${dep}</strong> &rarr; <strong>${arr}</strong>${status}</span>
            <span class="text-gray-500 text-xs bg-gray-100 px-1.5 py-0.5 rounded" title="Stepovers">${transfers}</span>
          </li>`;
        });
        html += `</ul>`;
      }
      html += `</div>`;
      
    } catch (e) {
      html += `<div class="mb-2">
        <div class="flex justify-between items-center font-bold text-gray-800 bg-gray-200 px-3 py-2 rounded text-sm mb-1 shadow-sm">
          <span>${route.label}</span>
        </div>
        <div class="text-sm text-red-500 px-1.5">Error: ${e.message}</div>
      </div>`;
    }
  }
  container.innerHTML = html;
}

// Startup Logic
const savedLocPref = localStorage.getItem('locationPref');
if (savedLocPref === 'auto') {
  autoLocate(false);
} else if (savedLocPref) {
  setLocation(savedLocPref, false);
} else {
  setLocation('Voorschoten', false); 
  if(savedKey) updateApp(); 
}
</script>
</body>
</html>
