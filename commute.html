<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commute App</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .bar-container { display: flex; align-items: flex-end; height: 75px; gap: 4px; margin-top: 18px; }
  .bar { background-color: #3b82f6; width: 100%; border-radius: 2px 2px 0 0; transition: height 0.3s; position: relative; }
  .bar-label { font-size: 0.75rem; text-align: center; color: #6b7280; overflow: hidden; margin-top: 2px;}
  .bar-value { font-size: 0.75rem; text-align: center; position: absolute; top: -18px; left: 0; right: 0; color: #1d4ed8; font-weight: bold; }
  
  @media (prefers-color-scheme: dark) {
    .bar { background-color: #3b82f6; }
    .bar-label { color: #9ca3af; }
    .bar-value { color: #93c5fd; }
  }
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 p-2 font-sans h-screen flex flex-col transition-colors duration-200">

<div id="debug-error" class="hidden bg-red-600 text-white p-2 rounded text-xs mb-2 font-mono break-words shadow-md"></div>

<div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 shadow-md dark:shadow-none rounded p-3 w-full border border-transparent dark:border-gray-700 transition-colors duration-200">
  
  <div class="mb-3 flex flex-wrap gap-2 items-center">
    <button onclick="setLocation('Voorschoten', true)" id="btn-voorschoten" class="px-3 py-1.5 rounded bg-blue-600 text-white text-sm shadow transition">Voorschoten</button>
    <button onclick="setLocation('AMS', true)" id="btn-ams" class="px-3 py-1.5 rounded bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 text-sm shadow transition">AMS</button>
    <button onclick="autoLocate(true)" class="px-3 py-1.5 rounded bg-gray-800 dark:bg-gray-600 hover:bg-gray-900 dark:hover:bg-gray-500 text-white text-sm shadow transition flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      Auto
    </button>
    
    <span id="location-status" class="text-sm text-green-600 dark:text-green-400 font-medium ml-auto"></span>
    
    <button onclick="updateApp()" class="w-8 h-8 rounded bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white shadow transition flex items-center justify-center ml-auto md:ml-0 active:scale-95">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="bg-white dark:bg-gray-800 p-2 rounded border dark:border-gray-700 shadow-sm transition-colors duration-200">
      <h2 class="text-base font-bold border-b dark:border-gray-700 pb-1 mb-1" id="rain-title">Rain (2h)</h2>
      <div class="bar-container" id="rain-bars"></div>
      <div class="flex mt-1 gap-1" id="rain-labels"></div>
      <div id="rain-error" class="text-sm text-red-500 dark:text-red-400 mt-1"></div>
    </div>

    <div class="bg-white dark:bg-gray-800 p-2 rounded border dark:border-gray-700 shadow-sm transition-colors duration-200">
      <h2 class="text-base font-bold border-b dark:border-gray-700 pb-1 mb-2">Trains</h2>
      <div id="train-content" class="space-y-2">
        <div class="text-sm text-gray-500 dark:text-gray-400 italic">Enter NS API key below and Load.</div>
      </div>
    </div>
  </div>

  <div class="mt-3 flex flex-row gap-2 items-center bg-gray-50 dark:bg-gray-800 p-2 rounded border dark:border-gray-700 transition-colors duration-200">
    <div class="flex-1 min-w-0">
      <input type="text" id="ns-api-key" placeholder="NS API Key" class="w-full border dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white p-1.5 text-sm rounded focus:outline-none focus:border-blue-500 dark:focus:border-blue-400 transition-colors" />
    </div>
    <button onclick="updateApp()" class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white px-4 py-1.5 text-sm rounded shadow transition whitespace-nowrap flex-shrink-0 active:scale-95">Load</button>
  </div>
</div>

<script>
window.onerror = function(m, s, l, c, e) { document.getElementById('debug-error').innerText = `Crash: ${m} (Line ${l})`; document.getElementById('debug-error').classList.remove('hidden'); };

const coords = { Voorschoten: { lat: 52.1258, lon: 4.4447 }, AMS: { lat: 52.3702, lon: 4.8952 } };
const trainRoutes = {
  Voorschoten: [
    { from: 'vst', to: 'dvd', label: 'Vst → Dvd', fromName: 'Voorschoten', toName: 'Duivendrecht' },
    { from: 'vst', to: 'asa', label: 'Vst → Sci Park', fromName: 'Voorschoten', toName: 'Amsterdam Science Park' },
    { from: 'llm', to: 'ut',  label: 'Lam → Ut', fromName: 'Leiden Lammenschans', toName: 'Utrecht Centraal' }
    ],
  AMS: [
    { from: 'dvd', to: 'vst', label: 'Dvd → Vst', fromName: 'Duivendrecht', toName: 'Voorschoten' },
    { from: 'asa', to: 'vst', label: 'Sci Park → Vst', fromName: 'Amsterdam Science Park', toName: 'Voorschoten' },
    { from: 'asa', to: 'asd', label: 'Sci Park → Centraal', fromName: 'Amsterdam Science Park', toName: 'Amsterdam Centraal' },
    { from: 'asd', to: 'asa', label: 'Centraal → Sci Park', fromName: 'Amsterdam Centraal', toName: 'Amsterdam Science Park' }  ]
};

let currentLoc = 'Voorschoten', geoWatchId = null;

function setLocation(loc, userAction = false) {
  const prev = currentLoc;
  currentLoc = loc;
  if(userAction) { localStorage.setItem('locationPref', loc); if(geoWatchId) { navigator.geolocation.clearWatch(geoWatchId); geoWatchId = null; } }
  document.getElementById('btn-voorschoten').className = loc === 'Voorschoten' ? 'px-3 py-1.5 rounded bg-blue-600 text-white text-sm shadow' : 'px-3 py-1.5 rounded bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 text-sm shadow';
  document.getElementById('btn-ams').className = loc === 'AMS' ? 'px-3 py-1.5 rounded bg-blue-600 text-white text-sm shadow' : 'px-3 py-1.5 rounded bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 text-sm shadow';
  document.getElementById('rain-title').innerText = `Rain: ${loc}`;
  if(prev !== loc || userAction) updateApp();
}

function autoLocate(userAction = false) {
  if(userAction) localStorage.setItem('locationPref', 'auto');
  document.getElementById('location-status').innerText = 'Detecting...';
  if(navigator.geolocation) {
    if(geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
    geoWatchId = navigator.geolocation.watchPosition(pos => {
      const {latitude: lat, longitude: lon} = pos.coords;
      const detected = Math.hypot(lat - coords.AMS.lat, lon - coords.AMS.lon) < Math.hypot(lat - coords.Voorschoten.lat, lon - coords.Voorschoten.lon) ? 'AMS' : 'Voorschoten';
      document.getElementById('location-status').innerText = `live`;
      if(currentLoc !== detected) setLocation(detected, false);
    }, () => { setLocation('Voorschoten', false); });
  } else setLocation('Voorschoten', false);
}

async function updateApp() { fetchRain(); fetchTrains(); }

async function fetchRain() {
  const c = coords[currentLoc];
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&minutely_15=precipitation&timeformat=unixtime&timezone=auto&forecast_days=1`, {cache: 'no-store'});
    const data = await res.json();
    const now = Math.floor(Date.now() / 1000);
    const startIdx = Math.max(0, data.minutely_15.time.findIndex(t => t >= now - 900));
    renderRain(data.minutely_15.time.slice(startIdx, startIdx + 8), data.minutely_15.precipitation.slice(startIdx, startIdx + 8));
  } catch(e) { document.getElementById('rain-error').innerText = 'Failed to load rain'; }
}

function renderRain(times, precip) {
  const bars = document.getElementById('rain-bars'), labels = document.getElementById('rain-labels');
  bars.innerHTML = ''; labels.innerHTML = '';
  const max = Math.max(0.5, ...precip);
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  precip.forEach((val, i) => {
    const col = document.createElement('div'); col.className = 'flex-1 flex flex-col justify-end relative';
    const bar = document.createElement('div'); bar.className = 'bar'; bar.style.height = `${(val/max)*100}%`; bar.style.backgroundColor = val === 0 ? (isDark ? '#374151' : '#e5e7eb') : '#3b82f6';
    if(val > 0) { const v = document.createElement('div'); v.className = 'bar-value'; v.innerText = val.toFixed(1); col.appendChild(v); }
    col.appendChild(bar); bars.appendChild(col);
    const l = document.createElement('div'); l.className = 'bar-label flex-1'; l.innerText = new Date(times[i] * 1000).toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
    labels.appendChild(l);
  });
}

async function fetchTrains() {
  const apiKey = document.getElementById('ns-api-key').value.trim();
  const container = document.getElementById('train-content');
  if(!apiKey) { container.innerHTML = '<div class="text-red-500 dark:text-red-400 text-sm">Need API key</div>'; return; }
  localStorage.setItem('nsApiKey', apiKey);
  container.innerHTML = '<div class="text-sm text-gray-500 dark:text-gray-400">Fetching...</div>';
  let html = '';
  for(const route of trainRoutes[currentLoc]) {
    const nsListUrl = `https://www.ns.nl/reisplanner/#/?vertrek=${encodeURIComponent(route.fromName)}&vertrektype=treinstation&aankomst=${encodeURIComponent(route.toName)}&aankomsttype=treinstation`;
    try {
      const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(`https://gateway.apiportal.ns.nl/reisinformatie-api/api/v3/trips?fromStation=${route.from}&toStation=${route.to}&nextAdvises=6&subscription-key=${apiKey}&dateTime=${new Date().toISOString().split('.')[0]+'Z'}`)}&cb=${Date.now()}`, {cache: 'no-store'});
      const data = await res.json();
      const trips = data.trips || [];
      const minT = trips.length ? Math.min(...trips.map(t => t.transfers || 0)) : 0;
      html += `<div class="mb-2"><a href="${nsListUrl}" target="_blank" class="flex justify-between items-center font-bold text-gray-800 dark:text-gray-200 bg-gray-200 dark:bg-gray-700 px-3 py-2 rounded text-sm mb-1 transition block"><span>${route.label}</span><span class="text-xs text-blue-600 dark:text-blue-400 bg-white dark:bg-gray-800 px-2 py-1 rounded">NS App</span></a><ul class="space-y-0 px-1">`;
      trips.forEach(t => {
        const d = new Date(t.legs[0].origin.plannedDateTime);
        const a = new Date(t.legs[t.legs.length-1].destination.plannedDateTime);
        const now = new Date();
        const minutesUntilDeparture = Math.max(0, Math.round((d - now) / 60000));
        
        // Formatting: "  in Xm" or "  in XXm" using non-breaking spaces
        const timeStr = `${minutesUntilDeparture}m`;
        const paddedTime = '  ' + timeStr.padStart(timeStr.length + (minutesUntilDeparture < 10 ? 0 : 1), ' ');
        const htmlSafeTime = paddedTime.replace(/ /g, '&nbsp;');

        const dur = Math.round((a - d)/60000);
        const isBest = t.transfers === minT;
        
        const bestClass = isBest ? 'bg-green-600/30 text-green-300 border border-green-500/50' : 'bg-gray-700 text-gray-400';
        
        html += `<li class="flex justify-between items-center text-sm border-b border-gray-100 dark:border-gray-700 py-1 ${isBest ? 'font-medium text-white' : 'text-gray-500 dark:text-gray-400'}">
          <span>
            <strong>${d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</strong> → 
            <strong>${a.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</strong>
            <span class="text-xs text-gray-700 font-mono">&nbsp;&nbsp;${htmlSafeTime}</span>
          </span>
          <span class="flex gap-2">
            <span class="text-xs">${dur}m</span>
            <span class="${bestClass} px-1.5 rounded font-bold">${t.transfers||0}</span>
          </span>
        </li>`;
      });
      html += `</ul></div>`;
    } catch(e) { html += `<div class="mb-2"><div class="px-3 py-2 bg-gray-200 rounded text-sm">${route.label}</div><div class="text-red-500 text-sm">Error</div></div>`; }
  }
  container.innerHTML = html;
}

try {
  const k = localStorage.getItem('nsApiKey'); if(k) document.getElementById('ns-api-key').value = k;
  const p = localStorage.getItem('locationPref');
  if(p === 'auto') autoLocate(false); else if(p) setLocation(p, false); else setLocation('Voorschoten', false);
  if(k) updateApp();
} catch(e) { console.error(e); }
</script>
</body>
</html>
